<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e1a">
  <title>Space Commander</title>
  <style>
    :root {
      /* Mirrored into JS by render.ts (worldTransform) — env() is only
         readable from CSS, so expose the safe-area insets as variables. */
      --sai-top: env(safe-area-inset-top, 0px);
      --sai-right: env(safe-area-inset-right, 0px);
      --sai-bottom: env(safe-area-inset-bottom, 0px);
      --sai-left: env(safe-area-inset-left, 0px);
      --panel: #141a30;
      --panel-line: #2a3150;
      --text: #e8ecff;
      --dim: #8b93b8;
      --accent: #4da6ff;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e1a;
      color: var(--text);
      font-family: system-ui, sans-serif;
      /* No pull-to-refresh / rubber-band scrolling */
      overscroll-behavior: none;
      /* No long-press text selection or callouts */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      /* Pin the page so iOS Safari can't scroll it under the address bar */
      position: fixed;
      inset: 0;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      /* Disable browser touch gestures (pan, pinch-zoom, double-tap zoom) */
      touch-action: none;
    }

    /* --- Flow overlays (QUA-124). One panel per screen; main.ts toggles
       .hidden from the flow state machine. --- */
    .hidden { display: none !important; }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end; /* bottom sheet: one-handed reach */
      justify-content: center;
      background: rgba(11, 14, 26, 0.82);
      z-index: 10;
      padding:
        calc(var(--sai-top) + 12px)
        calc(var(--sai-right) + 12px)
        calc(var(--sai-bottom) + 12px)
        calc(var(--sai-left) + 12px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      margin-bottom: 4vh;
    }
    .panel h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: 0.04em;
    }
    .panel h2 { margin: 0 0 16px; font-size: 15px; color: var(--dim); font-weight: normal; }
    .row { margin: 14px 0; }
    .row label {
      display: block;
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .seg {
      display: flex;
      gap: 8px;
    }
    .seg button {
      flex: 1;
      min-height: 48px;
      font-size: 16px;
      color: var(--text);
      background: #0e1326;
      border: 1px solid var(--panel-line);
      border-radius: 12px;
    }
    .seg button.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #10203a;
    }
    #seed {
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      background: #0e1326;
      border: 1px solid var(--panel-line);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      padding: 0 14px;
      -webkit-user-select: text;
      user-select: text;
    }
    .big {
      width: 100%;
      min-height: 56px;
      font-size: 18px;
      font-weight: bold;
      color: #06101f;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      margin-top: 6px;
    }
    .big.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button { touch-action: manipulation; }

    #pauseBtn {
      position: fixed;
      top: calc(var(--sai-top) + 10px);
      right: calc(var(--sai-right) + 10px);
      z-index: 5;
      min-width: 48px;
      min-height: 48px;
      font-size: 20px;
      color: var(--dim);
      background: rgba(20, 26, 48, 0.8);
      border: 1px solid var(--panel-line);
      border-radius: 12px;
    }

    /* --- QUA-131 in-game HUD: send-fraction chip, spec button, type picker --- */
    #fracChip {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(var(--sai-bottom) + 14px);
      z-index: 5;
      min-width: 76px;
      min-height: 48px;
      font-size: 17px;
      font-weight: bold;
      color: var(--accent);
      background: rgba(20, 26, 48, 0.85);
      border: 1px solid var(--accent);
      border-radius: 24px;
    }
    #specBtn {
      position: fixed;
      z-index: 5;
      width: 44px;
      height: 44px;
      font-size: 20px;
      color: var(--text);
      background: rgba(20, 26, 48, 0.85);
      border: 1px solid var(--panel-line);
      border-radius: 22px;
      padding: 0;
    }
    #specPicker {
      position: fixed;
      z-index: 6;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      border-radius: 14px;
      padding: 8px;
    }
    #specPickerCost {
      font-size: 12px;
      color: var(--dim);
      text-align: center;
      margin-bottom: 6px;
    }
    #specPickerRow {
      display: flex;
      gap: 6px;
    }
    #specPickerRow button {
      min-width: 52px;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 12px;
      color: var(--text);
      background: #0e1326;
      border: 1px solid var(--panel-line);
      border-radius: 12px;
    }
    #specPickerRow button .glyph { font-size: 16px; }
    #specPickerRow button:disabled { opacity: 0.4; }

    #pauseOverlay .panel { text-align: center; }
    #endTitle.victory { color: var(--accent); }
    #endTitle.defeat { color: #ff5d5d; }
    #endStats { list-style: none; margin: 0 0 10px; padding: 0; }
    #endStats li {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid var(--panel-line);
      font-size: 15px;
    }
    #endStats li span:first-child { color: var(--dim); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <button id="pauseBtn" class="hidden" aria-label="Pause">&#10073;&#10073;</button>

  <!-- QUA-131 in-game HUD: positioned/toggled by hud.ts every frame -->
  <button id="fracChip" class="hidden" aria-label="Send amount"></button>
  <button id="specBtn" class="hidden" aria-label="Specialise planet">&#9881;</button>
  <div id="specPicker" class="hidden">
    <div id="specPickerCost"></div>
    <div id="specPickerRow"></div>
  </div>

  <div id="setupOverlay" class="overlay hidden">
    <div class="panel">
      <h1>SPACE COMMANDER</h1>
      <h2>Skirmish setup</h2>
      <div class="row">
        <label>Factions</label>
        <div class="seg" id="factionSeg">
          <button data-factions="2">2 — you vs 1 AI</button>
          <button data-factions="3">3 — you vs 2 AI</button>
        </div>
      </div>
      <div class="row" id="ai1Row">
        <label>AI 1 difficulty</label>
        <div class="seg" data-ai="0">
          <button data-tier="easy">Easy</button>
          <button data-tier="medium">Medium</button>
          <button data-tier="hard">Hard</button>
        </div>
      </div>
      <div class="row" id="ai2Row">
        <label>AI 2 difficulty</label>
        <div class="seg" data-ai="1">
          <button data-tier="easy">Easy</button>
          <button data-tier="medium">Medium</button>
          <button data-tier="hard">Hard</button>
        </div>
      </div>
      <div class="row">
        <label>Seed &mdash; blank for random</label>
        <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="random">
      </div>
      <button id="startBtn" class="big">Start</button>
    </div>
  </div>

  <div id="pauseOverlay" class="overlay hidden">
    <div class="panel">
      <h1>Paused</h1>
      <h2>Production, fleets and AI are frozen</h2>
      <button id="resumeBtn" class="big">Resume</button>
    </div>
  </div>

  <div id="endOverlay" class="overlay hidden">
    <div class="panel">
      <h1 id="endTitle">Victory</h1>
      <h2 id="endSub">Skirmish complete</h2>
      <ul id="endStats"></ul>
      <button id="replayBtn" class="big secondary">Replay seed</button>
      <button id="restartBtn" class="big">New game</button>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
