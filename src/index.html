<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e1a">
  <title>Space Commander</title>
  <style>
    :root {
      /* Mirrored into JS by render.ts (worldTransform) — env() is only
         readable from CSS, so expose the safe-area insets as variables. */
      --sai-top: env(safe-area-inset-top, 0px);
      --sai-right: env(safe-area-inset-right, 0px);
      --sai-bottom: env(safe-area-inset-bottom, 0px);
      --sai-left: env(safe-area-inset-left, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e1a;
      /* No pull-to-refresh / rubber-band scrolling */
      overscroll-behavior: none;
      /* No long-press text selection or callouts */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      /* Pin the page so iOS Safari can't scroll it under the address bar */
      position: fixed;
      inset: 0;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      /* Disable browser touch gestures (pan, pinch-zoom, double-tap zoom) */
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="./main.js"></script>
</body>
</html>
